[project]
name = "pytorch-foundations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.11.2", "torch>=2.14.0", "torchvision>=0.29.0"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"

[tool.pyright]
venvPath = "."
venv = ".venv"
